name: Bug report
description: Report a reproducible problem with Nix.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets or private data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Tell us exactly how to reproduce the problem.
      placeholder: "1. Open ...\n2. Tap ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome 140 on Android 15"
    validations:
      required: true
