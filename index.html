<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Nix — Timeline Dodge. Skill. Juice. Survive.">
<meta name="theme-color" content="#0f0f13">
<title>Nix • Timeline Dodge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#0f0f13;--card:#1a1a24;--accent:#1d9bf0;--pink:#f91880;--green:#00ba7c;--text:#e7e9ea;--muted:#71767b;--yellow:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation}
.game-container{width:100%;max-width:380px;height:min(640px,100dvh);background:var(--card);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 25px 50px -12px rgb(0 0 0 / .55);border:1px solid #2f3336}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(15,15,19,.92);z-index:20;pointer-events:auto}
.overlay.hidden{display:none!important}
.overlay h1{font-size:28px;font-weight:700;margin-bottom:6px;text-align:center}
.overlay .tag{font-size:13px;color:var(--muted);margin-bottom:18px;text-align:center}
.score-big{font-size:48px;font-weight:700;color:var(--accent);margin:4px 0}
.best{font-size:13px;color:var(--muted);margin-bottom:14px}
.btn{background:var(--accent);color:#fff;border:none;padding:14px 28px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(29,155,240,.35);min-height:48px;margin:6px;transition:transform .12s;outline:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn.secondary{background:#2f3336;box-shadow:none}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;font-size:14px;font-weight:600}
.hud .mult{color:var(--yellow)}
.hud .clean{color:var(--green)}
.hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);z-index:10;pointer-events:none}
.care-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div class="game-container" id="root">
  <canvas id="c" width="380" height="640" aria-label="Timeline Dodge playfield"></canvas>
  <div class="hud" id="hud" hidden>
    <div><span id="score">0</span> <span class="mult" id="mult"></span></div>
    <div class="clean" id="clean"></div>
    <div id="hearts">♥♥♥</div>
  </div>
  <div class="hint" id="hint" hidden>A / ← left · D / → right · near-miss for CLEAN</div>

  <!-- MAIN MENU -->
  <div class="overlay" id="menu" role="dialog" aria-labelledby="title">
    <div style="font-size:42px;margin-bottom:8px" aria-hidden="true">🐻</div>
    <h1 id="title">Nix</h1>
    <p class="tag">Timeline Dodge · Skill first</p>
    <p class="best" id="bestLabel">Best: 0</p>
    <button type="button" class="btn" id="startBtn" data-testid="start-run">Start Run</button>
    <p style="font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.4">
      3 lanes · dodge posts · near-miss window for CLEAN streak<br>
      Blue Check = slow-mo · risk hearts
    </p>
  </div>

  <!-- RESULTS -->
  <div class="overlay hidden" id="results" role="dialog" aria-labelledby="resTitle">
    <div style="font-size:36px;margin-bottom:4px" id="resEmoji">🐻</div>
    <h1 id="resTitle">Run Over</h1>
    <div class="score-big" id="resScore">0</div>
    <p class="best" id="resStats">0 CLEAN · ×1.0</p>
    <div class="care-row">
      <button type="button" class="btn" id="againBtn">Play Again</button>
      <button type="button" class="btn secondary" id="menuBtn">Menu</button>
    </div>
    <button type="button" class="btn secondary" id="shareBtn" style="margin-top:8px">Challenge Friend</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ─── Constants ───────────────────────────────────────────────
  const LANES = 3;
  const PLAYER_Y = 0.78;
  const POST_H = 44;
  const HEART_R = 12;
  const NEAR_MISS = 34;
  const PART_POOL = 64;
  const LS_KEY = "nix_dodge_v24";
  const WAVES = [[0,2],[1],[0,1],[2],[0,2],[1,2],[0],[0,1,2],[1],[0,2]];
  const STAGES = ["Egg","Hatchling","Timeline Cub","Thread Beast","Viral Legend"];
  const STAGE_EMOJI = ["🥚","🐣","🐻","🐉","👑"];

  // ─── Canvas ──────────────────────────────────────────────────
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  if (!ctx) { document.body.innerHTML = "<p style='color:#fff;padding:2rem'>Canvas unsupported</p>"; return; }

  // ─── DOM ─────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const menuEl = $("menu");
  const resultsEl = $("results");
  const hudEl = $("hud");
  const hintEl = $("hint");
  const startBtn = $("startBtn");
  const againBtn = $("againBtn");
  const menuBtn = $("menuBtn");
  const shareBtn = $("shareBtn");
  const scoreEl = $("score");
  const multEl = $("mult");
  const cleanEl = $("clean");
  const heartsEl = $("hearts");
  const bestLabel = $("bestLabel");
  const resScore = $("resScore");
  const resStats = $("resStats");
  const resEmoji = $("resEmoji");

  // ─── State ───────────────────────────────────────────────────
  let phase = "menu"; // menu | running | results
  let W = 380, H = 640;
  let lane = 1;          // 0..2
  let targetLane = 1;
  let laneX = [];
  let playerX = 0;
  let score = 0;
  let best = 0;
  let mult = 1;
  let maxMult = 1;
  let nearMisses = 0;
  let hearts = 3;
  let slowmo = 0;
  let runTime = 0;
  let spawnT = 0;
  let waveIdx = 0;
  let posts = [];
  let heartsPick = [];
  let particles = [];
  let freeParts = [];
  let raf = 0;
  let lastTs = 0;
  let hitFlash = 0;
  let cleanFlash = 0;
  let starting = false;

  // care (lightweight)
  let care = { stage: 0, total: 0 };

  // ─── Helpers ─────────────────────────────────────────────────
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.best === "number") best = d.best;
      if (d.care) care = Object.assign(care, d.care);
    } catch (_) {}
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ best, care }));
    } catch (_) {}
  }

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.floor(rect.width) || 380;
    H = Math.floor(rect.height) || 640;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    laneX = [];
    for (let i = 0; i < LANES; i++) {
      laneX[i] = (i + 0.5) * (W / LANES);
    }
    playerX = laneX[lane];
  }

  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  // ─── Particle pool ───────────────────────────────────────────
  function initPool() {
    particles = [];
    freeParts = [];
    for (let i = 0; i < PART_POOL; i++) {
      const p = { x:0,y:0,vx:0,vy:0,life:0,max:0,r:0,col:"#fff",active:false };
      particles.push(p);
      freeParts.push(p);
    }
  }
  function spawnPart(x, y, vx, vy, life, r, col) {
    const p = freeParts.pop();
    if (!p) return;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = life; p.max = life; p.r = r; p.col = col; p.active = true;
  }
  function burst(x, y, n, col) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      spawnPart(x, y, Math.cos(a)*sp, Math.sin(a)*sp, 0.35 + Math.random()*0.4, 2+Math.random()*3, col);
    }
  }

  // ─── Game control ────────────────────────────────────────────
  function startRun() {
    if (starting || phase === "running") return;
    starting = true;
    phase = "running";
    hide(menuEl);
    hide(resultsEl);
    hudEl.hidden = false;
    hintEl.hidden = false;
    canvas.style.pointerEvents = "auto";

    lane = 1; targetLane = 1; playerX = laneX[1] || W/2;
    score = 0; mult = 1; maxMult = 1; nearMisses = 0;
    hearts = 3; slowmo = 0; runTime = 0; spawnT = 0.6; waveIdx = 0;
    posts = []; heartsPick = []; hitFlash = 0; cleanFlash = 0;
    initPool();
    updateHUD();
    lastTs = 0;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
    starting = false;
  }

  function endRun() {
    if (phase !== "running") return;
    phase = "results";
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    hudEl.hidden = true;
    hintEl.hidden = true;
    canvas.style.pointerEvents = "none";

    if (score > best) { best = score; save(); }
    care.total += score;
    if (care.total > 2000) care.stage = 4;
    else if (care.total > 800) care.stage = 3;
    else if (care.total > 300) care.stage = 2;
    else if (care.total > 80) care.stage = 1;
    save();

    resScore.textContent = String(Math.floor(score));
    resStats.textContent = nearMisses + " CLEAN · ×" + maxMult.toFixed(1);
    resEmoji.textContent = STAGE_EMOJI[Math.min(care.stage, 4)];
    show(resultsEl);
  }

  function goMenu() {
    phase = "menu";
    hide(resultsEl);
    show(menuEl);
    bestLabel.textContent = "Best: " + best;
    canvas.style.pointerEvents = "none";
  }

  function updateHUD() {
    scoreEl.textContent = String(Math.floor(score));
    multEl.textContent = mult > 1 ? "×" + mult.toFixed(1) : "";
    cleanEl.textContent = nearMisses > 0 ? nearMisses + " CLEAN" : "";
    heartsEl.textContent = "♥".repeat(Math.max(0, hearts)) + "♡".repeat(Math.max(0, 3 - hearts));
  }

  // ─── Input ───────────────────────────────────────────────────
  function moveLeft() {
    if (phase !== "running") return;
    targetLane = Math.max(0, targetLane - 1);
  }
  function moveRight() {
    if (phase !== "running") return;
    targetLane = Math.min(LANES - 1, targetLane + 1);
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === "ArrowLeft" || e.code === "KeyA") { e.preventDefault(); moveLeft(); }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { e.preventDefault(); moveRight(); }
    else if (e.code === "Enter" || e.code === "Space") {
      e.preventDefault();
      if (phase === "menu") startRun();
      else if (phase === "results") startRun();
    }
  }

  // pointer / touch on canvas for lane change
  let touchStartX = 0;
  function onPointerDown(e) {
    if (phase !== "running") return;
    touchStartX = e.clientX ?? ((e.touches && e.touches[0] && e.touches[0].clientX) || 0);
  }
  function onPointerUp(e) {
    if (phase !== "running") return;
    const x = e.clientX ?? ((e.changedTouches && e.changedTouches[0] && e.changedTouches[0].clientX) || 0);
    const dx = x - touchStartX;
    if (Math.abs(dx) > 24) {
      if (dx < 0) moveLeft(); else moveRight();
    } else {
      // tap left/right half
      const rect = canvas.getBoundingClientRect();
      if (x - rect.left < rect.width / 2) moveLeft(); else moveRight();
    }
  }

  // robust Start binding — pointerup + click + keyboard
  function bindStart(btn, fn) {
    let locked = false;
    const go = (e) => {
      if (locked) return;
      locked = true;
      if (e) { e.preventDefault(); e.stopPropagation(); }
      fn();
      setTimeout(() => { locked = false; }, 400);
    };
    btn.addEventListener("pointerup", go, { passive: false });
    btn.addEventListener("click", go);
  }

  bindStart(startBtn, startRun);
  bindStart(againBtn, startRun);
  menuBtn.addEventListener("click", goMenu);
  shareBtn.addEventListener("click", () => {
    const text = `I scored ${score} on Nix Timeline Dodge. Beat me! #ViralPet #Nix`;
    if (navigator.share) {
      navigator.share({ title: "Nix", text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        shareBtn.textContent = "Copied!";
        setTimeout(() => { shareBtn.textContent = "Challenge Friend"; }, 1500);
      }).catch(() => {});
    }
  });

  window.addEventListener("keydown", onKey);
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointerup", onPointerUp);

  // public hooks for tests / QA
  window.__nixStart = startRun;
  window.__controlsTest = {
    getYaw: () => -targetLane,
    left: moveLeft,
    right: moveRight,
    phase: () => phase
  };

  // ─── Spawn ───────────────────────────────────────────────────
  function spawnWave() {
    const w = WAVES[waveIdx % WAVES.length];
    waveIdx++;
    const speed = 180 + Math.min(220, runTime * 12);
    for (const ln of w) {
      posts.push({
        lane: ln,
        y: -POST_H - 10,
        speed,
        hit: false,
        cleaned: false,
        kind: Math.random() < 0.08 ? "blue" : "post"
      });
    }
    if (Math.random() < 0.18) {
      let free = [0,1,2].filter(i => !w.includes(i));
      if (free.length) {
        const ln = free[(Math.random() * free.length) | 0];
        heartsPick.push({ lane: ln, y: -30, speed: speed * 0.9, taken: false });
      }
    }
  }

  // ─── Update ──────────────────────────────────────────────────
  function update(dt) {
    if (phase !== "running") return;
    const t = slowmo > 0 ? dt * 0.42 : dt;
    if (slowmo > 0) slowmo -= dt;
    if (hitFlash > 0) hitFlash -= dt;
    if (cleanFlash > 0) cleanFlash -= dt;

    runTime += t;
    spawnT -= t;
    if (spawnT <= 0) {
      spawnWave();
      spawnT = Math.max(0.55, 1.15 - runTime * 0.018);
    }

    // smooth lane
    const tx = laneX[targetLane];
    playerX += (tx - playerX) * Math.min(1, 14 * t);
    lane = targetLane;

    const py = H * PLAYER_Y;
    const pr = 16;

    // posts
    for (let i = posts.length - 1; i >= 0; i--) {
      const p = posts[i];
      p.y += p.speed * t;
      if (p.y > H + 40) { posts.splice(i, 1); continue; }

      const px = laneX[p.lane];
      const dx = Math.abs(playerX - px);
      const dy = p.y + POST_H * 0.5 - py;

      if (!p.hit && dy > -POST_H * 0.6 && dy < POST_H * 0.55 && dx < 28) {
        p.hit = true;
        if (p.kind === "blue") {
          slowmo = 1.6;
          burst(px, p.y, 14, "#1d9bf0");
          mult = Math.min(8, mult + 0.5);
          maxMult = Math.max(maxMult, mult);
        } else {
          hearts--;
          hitFlash = 0.35;
          mult = 1;
          burst(px, p.y, 18, "#f91880");
          if (hearts <= 0) { endRun(); return; }
        }
      } else if (!p.cleaned && !p.hit && p.kind !== "blue") {
        // near-miss CLEAN window
        if (dy > -8 && dy < POST_H + 8 && dx > 28 && dx < NEAR_MISS + 28) {
          p.cleaned = true;
          nearMisses++;
          mult = Math.min(8, mult + 0.35);
          maxMult = Math.max(maxMult, mult);
          cleanFlash = 0.28;
          burst(px, p.y + POST_H * 0.4, 10, "#00ba7c");
        }
      }
    }

    // hearts pickups
    for (let i = heartsPick.length - 1; i >= 0; i--) {
      const h = heartsPick[i];
      h.y += h.speed * t;
      if (h.y > H + 20) { heartsPick.splice(i, 1); continue; }
      const px = laneX[h.lane];
      const dx = Math.abs(playerX - px);
      const dy = h.y - py;
      if (!h.taken && Math.abs(dy) < 22 && dx < 26) {
        h.taken = true;
        hearts = Math.min(3, hearts + 1);
        burst(px, h.y, 12, "#f91880");
        heartsPick.splice(i, 1);
      }
    }

    // particles
    for (const p of particles) {
      if (!p.active) continue;
      p.life -= t;
      if (p.life <= 0) {
        p.active = false;
        freeParts.push(p);
        continue;
      }
      p.x += p.vx * t;
      p.y += p.vy * t;
      p.vy += 180 * t;
    }

    score += (18 + mult * 22) * t;
    updateHUD();
  }

  // ─── Draw ────────────────────────────────────────────────────
  function drawPet(x, y, running) {
    const body = care.stage >= 3 ? "#7c3aed" : care.stage >= 2 ? "#3b82f6" : "#60a5fa";
    ctx.save();
    ctx.translate(x, y);
    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 20, 0, 0, Math.PI * 2);
    ctx.fillStyle = body;
    ctx.fill();
    // face
    ctx.fillStyle = "#0f0f13";
    ctx.beginPath(); ctx.arc(-6, -4, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -4, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 5, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    // cheeks
    ctx.fillStyle = "rgba(249,24,128,0.45)";
    ctx.beginPath(); ctx.arc(-11, 2, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, 2, 4, 0, Math.PI*2); ctx.fill();
    // limbs if running
    if (running) {
      const swing = Math.sin(runTime * 14) * 8;
      ctx.strokeStyle = body;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-10, 12); ctx.lineTo(-14, 22 + swing);
      ctx.moveTo(10, 12); ctx.lineTo(14, 22 - swing);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    // bg
    ctx.fillStyle = "#0f0f13";
    ctx.fillRect(0, 0, W, H);

    // lane guides
    ctx.strokeStyle = "rgba(47,51,54,0.7)";
    ctx.lineWidth = 2;
    for (let i = 1; i < LANES; i++) {
      const x = i * (W / LANES);
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
      ctx.stroke();
    }

    // posts
    for (const p of posts) {
      const x = laneX[p.lane];
      if (p.kind === "blue") {
        ctx.fillStyle = "#1d9bf0";
        ctx.beginPath();
        ctx.roundRect(x - 22, p.y, 44, POST_H, 10);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("✓", x, p.y + POST_H * 0.68);
      } else {
        ctx.fillStyle = p.hit ? "#f91880" : "#2f3336";
        ctx.beginPath();
        ctx.roundRect(x - 24, p.y, 48, POST_H, 8);
        ctx.fill();
        ctx.fillStyle = "#71767b";
        ctx.fillRect(x - 16, p.y + 10, 32, 6);
        ctx.fillRect(x - 16, p.y + 22, 20, 5);
      }
    }

    // heart pickups
    for (const h of heartsPick) {
      const x = laneX[h.lane];
      ctx.fillStyle = "#f91880";
      ctx.beginPath();
      ctx.arc(x, h.y, HEART_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "12px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("♥", x, h.y + 4);
    }

    // player
    const py = H * PLAYER_Y;
    if (hitFlash > 0) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(hitFlash * 40);
    }
    drawPet(playerX, py, phase === "running");
    ctx.globalAlpha = 1;

    // particles
    for (const p of particles) {
      if (!p.active) continue;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // flash overlays
    if (cleanFlash > 0) {
      ctx.fillStyle = `rgba(0,186,124,${0.12 * (cleanFlash / 0.28)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (hitFlash > 0) {
      ctx.fillStyle = `rgba(249,24,128,${0.15 * (hitFlash / 0.35)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ─── Loop ────────────────────────────────────────────────────
  function loop(ts) {
    if (phase !== "running") return;
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05; // cap
    update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ─── Boot ────────────────────────────────────────────────────
  load();
  bestLabel.textContent = "Best: " + best;
  resize();
  window.addEventListener("resize", resize);
  // initial idle draw
  drawPet(W / 2, H * PLAYER_Y, false);
  draw();

  // ensure menu visible on load
  show(menuEl);
  hide(resultsEl);
  hudEl.hidden = true;
  hintEl.hidden = true;
  canvas.style.pointerEvents = "none";

  console.info("[Nix] Timeline Dodge ready · Start Run bound");
})();
</script>
</body>
</html>
