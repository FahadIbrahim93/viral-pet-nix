<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="description" content="Nix — Timeline Dodge. Skill. Juice. Survive."><meta name="theme-color" content="#0f0f13"><title>Nix • Timeline Dodge</title><style> @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');:root{--bg:#0f0f13;--card:#1a1a24;--accent:#1d9bf0;--pink:#f91880;--green:#00ba7c;--text:#e7e9ea;--muted:#71767b;--yellow:#fbbf24}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}.game-container{width:100%;max-width:380px;height:640px;background:var(--card);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 25px 50px -12px rgb(0 0 0 / .55);border:1px solid #2f3336}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(15,15,19,.9);z-index:20;pointer-events:auto}.overlay.hidden{display:none}.overlay h1{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}.overlay p{font-size:14px;color:var(--muted);text-align:center;margin-bottom:16px;line-height:1.45}.score-big{font-size:52px;font-weight:700;color:var(--accent);margin:6px 0 2px}.best{font-size:13px;color:var(--muted);margin-bottom:16px}.btn{background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(29,155,240,.35);min-height:48px;margin:5px;transition:transform .15s}.btn:active{transform:scale(.96)}.btn.secondary{background:rgba(255,255,255,.1);box-shadow:none}.hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}.lives{color:#f91880;font-size:16px;font-weight:600}.score{color:#1d9bf0;font-size:22px;font-weight:700}.mult{color:#fbbf24;font-size:12px}.streak{color:#00ba7c;font-size:11px}.hint-bar{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;z-index:10;display:none}.pop{position:absolute;font-weight:700;font-size:14px;pointer-events:none;z-index:15;animation:popUp .7s ease-out forwards}@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(1.15)}}.care-panel{width:100%;max-width:300px;margin:10px 0 14px;padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);text-align:left;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.25)}.care-panel::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(249,24,128,.35),rgba(29,155,240,.25),rgba(251,191,36,.2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.care-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}.care-pet-wrap{position:relative;flex-shrink:0;width:76px;height:76px}.care-pet{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 30% 30%,#93c5fd,#2563eb);box-shadow:0 0 28px rgba(96,165,250,.45),inset 0 -6px 12px rgba(0,0,0,.15);transition:transform .35s,background .5s,box-shadow .5s;position:relative;z-index:2}.care-pet-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,#1d9bf0,#f91880,#fbbf24) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ringSpin 8s linear infinite;opacity:.7}.care-pet.bounce{animation:careBounce .6s cubic-bezier(.34,1.56,.64,1)}.care-pet.evolve{animation:careEvolve 1s cubic-bezier(.34,1.4,.64,1)}.care-pet.happy{animation:careHappy .8s ease}@keyframes careBounce{0%{transform:scale(1)}35%{transform:scale(1.28)}60%{transform:scale(.92)}100%{transform:scale(1)}}@keyframes careEvolve{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.4) rotate(-12deg)}50%{transform:scale(1.25) rotate(10deg)}75%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}@keyframes careHappy{0%,100%{transform:scale(1) translateY(0)}20%{transform:scale(1.15) translateY(-6px)}40%{transform:scale(1.05) translateY(0)}60%{transform:scale(1.12) translateY(-4px)}80%{transform:scale(1.02) translateY(0)}}@keyframes ringSpin{to{transform:rotate(360deg)}}.care-meta{flex:1;min-width:0}.care-stage{font-weight:700;font-size:17px;color:#e7e9ea;letter-spacing:-.02em}.care-sub{font-size:12px;color:#a0a4a8;margin-top:3px;line-height:1.35}.care-xp{font-size:11px;color:#71767b;margin-top:6px;display:flex;align-items:center;gap:6px}.care-xp-bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.care-xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width .6s ease;box-shadow:0 0 8px rgba(251,191,36,.4)}.care-stages{display:flex;gap:4px;margin-top:8px}.care-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .3s}.care-dot.on{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.6)}.care-dot.cur{transform:scale(1.35);background:#fff}.bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:#c0c4c8}.bar-row span.label{width:42px;flex-shrink:0;font-weight:500;display:flex;align-items:center;gap:3px}.bar-track{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}.bar-fill{height:100%;border-radius:999px;width:0%;transition:width .55s cubic-bezier(.22,1,.36,1)}.bar-fill.att{background:linear-gradient(90deg,#1d9bf0,#60a5fa);box-shadow:0 0 10px rgba(29,155,240,.35)}.bar-fill.ene{background:linear-gradient(90deg,#00ba7c,#34d399);box-shadow:0 0 10px rgba(0,186,124,.3)}.bar-fill.mood{background:linear-gradient(90deg,#f91880,#fb7185);box-shadow:0 0 10px rgba(249,24,128,.35)}.care-react{font-size:13px;color:#e7e9ea;min-height:22px;margin-top:10px;text-align:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.04);line-height:1.4;transition:color .3s,background .3s}.care-react.good{color:#34d399;background:rgba(52,211,153,.08)}.care-react.evo{color:#fbbf24;font-weight:700;background:rgba(251,191,36,.1);animation:reactPulse .6s ease}.care-react.full{color:#f91880;background:rgba(249,24,128,.08)}@keyframes reactPulse{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}.btn.care-primary{background:linear-gradient(135deg,#f91880 0%,#ec4899 40%,#1d9bf0 100%);box-shadow:0 6px 20px rgba(249,24,128,.4),0 0 0 0 rgba(249,24,128,.3);font-size:16px;padding:15px 28px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s}.btn.care-primary:not(:disabled):hover{box-shadow:0 8px 28px rgba(249,24,128,.5)}.btn.care-primary:not(:disabled){animation:btnGlow 2.2s ease-in-out infinite}.btn.care-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;animation:none}@keyframes btnGlow{0%,100%{box-shadow:0 6px 20px rgba(249,24,128,.4)}50%{box-shadow:0 6px 28px rgba(249,24,128,.55),0 0 0 6px rgba(249,24,128,.08)}}.care-float{position:absolute;font-weight:700;font-size:14px;pointer-events:none;z-index:30;animation:floatUp .9s ease-out forwards;text-shadow:0 1px 4px rgba(0,0,0,.4)}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-42px) scale(1.15)}}.care-burst{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}.care-burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:#f91880;animation:burst 0.7s ease-out forwards}@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{opacity:0}}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}</style></head><body><div class="game-container" id="root"><canvas id="c"></canvas><div class="hud" id="hud"><div><div class="lives" id="lives">♥ ♥ ♥</div><div class="mult" id="mult">×1</div><div class="streak" id="streak"></div></div><div class="score" id="score">0</div></div><div class="hint-bar" id="hint">Tap left / right side to dodge</div><div class="overlay" id="menu"><h1>Nix</h1><p>Dodge the timeline.<br>Near-miss for style. Streak for shield.</p><button class="btn" id="startBtn">Start Run</button><p style="margin-top:14px;font-size:12px">Best: <span id="menuBest">0</span></p></div><div class="overlay hidden" id="results"><h1>Run Over</h1><div class="score-big" id="finalScore">0</div><div class="best" id="finalBest">Best: 0</div><p id="statsLine" style="font-size:13px;margin-bottom:6px"></p><div class="care-panel" id="carePanel"><div class="care-burst" id="careBurst"></div><div class="care-head"><div class="care-pet-wrap"><div class="care-pet-ring"></div><div class="care-pet" id="carePet">🥚</div></div><div class="care-meta"><div class="care-stage" id="careStage">Egg</div><div class="care-sub" id="careSub">Power Nix with this run</div><div class="care-xp" id="careXp"><span id="careXpLabel">Next</span><div class="care-xp-bar"><div class="care-xp-fill" id="careXpFill" style="width:0%"></div></div></div><div class="care-stages" id="careStages"><span class="care-dot on cur"></span><span class="care-dot"></span><span class="care-dot"></span><span class="care-dot"></span><span class="care-dot"></span></div></div></div><div class="bar-row"><span class="label">👀 Att</span><div class="bar-track"><div class="bar-fill att" id="barAtt"></div></div></div><div class="bar-row"><span class="label">⚡ Ene</span><div class="bar-track"><div class="bar-fill ene" id="barEne"></div></div></div><div class="bar-row"><span class="label">💕 Mood</span><div class="bar-track"><div class="bar-fill mood" id="barMood"></div></div></div><div class="care-react" id="careReact">Ready for treats!</div></div><button class="btn care-primary" id="careBtn">Give Nix a treat 💕</button><button class="btn" id="againBtn">Play Again</button><button class="btn secondary" id="challengeBtn">Challenge Friend</button><button class="btn secondary" id="cardBtn">Score Card</button></div></div><script>
(()=>{'use strict';
const LANES=3,PLAYER_Y=0.78,POST_H=40,HEART_R=11,NEAR_MISS=34;
const laneXs=[0,0,0];
function recomputeLanes(){if(!W)return;const m=W*0.13,step=(W-m*2)/LANES;for(let i=0;i<LANES;i++)laneXs[i]=m+(i+0.5)*step}
function laneX(lane){const i=lane|0;if(lane===i)return laneXs[i]||0;const a=laneXs[i]||0,b=laneXs[Math.min(i+1,LANES-1)]||a;return a+(b-a)*(lane-i)}
function circleRect(px,py,pr,rx,ry,rw,rh){const cx=Math.max(rx,Math.min(px,rx+rw)),cy=Math.max(ry,Math.min(py,ry+rh)),dx=px-cx,dy=py-cy;return dx*dx+dy*dy<pr*pr}
function scoreOf(dist,hearts,mult,nearMisses){return Math.floor(dist*0.14+hearts*30*mult+nearMisses*24)}
function runTests(){const a=(ok,m)=>{if(!ok)console.error('FAIL',m)};const m=300*0.13,step=(300-m*2)/3;a(m+0.5*step<m+1.5*step,'lanes');a(circleRect(50,50,10,45,45,20,20),'hit');a(!circleRect(10,10,5,80,80,20,20),'miss');a(scoreOf(1000,2,2,3)===140+120+72,'score');console.log('logic ok')}
runTests();
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
let W=0,H=0;
function resize(){const r=canvas.parentElement.getBoundingClientRect();W=r.width;H=r.height;canvas.width=(W*dpr)|0;canvas.height=(H*dpr)|0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;recomputeLanes()}
resize();addEventListener('resize',resize);
let actx=null;
function beep(f,d,type,vol){try{if(!actx)actx=new(AudioContext||webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||0.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const KEY='nix_dodge_v21';let best=0;let care={att:40,ene:40,mood:40,stage:0,total:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s.best)best=s.best;if(s.care)care=Object.assign(care,s.care)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({best,care}))}catch(e){}}
const STAGES=['Egg','Hatchling','Timeline Cub','Thread Beast','Viral Legend'];
const STAGE_EMOJI=['🥚','🐣','🐻','🐉','👑'];
const STAGE_TIP=['A warm little egg. Feed it your best runs.','Peeking out! Keep the treats coming.','Timeline Cub is learning the lanes.','Thread Beast rules the feed.','Viral Legend. You raised a star ✨'];
let spentThisRun=false;

document.getElementById('menuBest').textContent=best;
let mode='menu',targetLane=1,visualLane=1,lives=3,dist=0,hearts=0,mult=1,nearMisses=0,speed=2.6,posts=[],floats=[],pops=[];
const PART_POOL_SIZE=64,partPool=new Array(PART_POOL_SIZE),freeList=new Array(PART_POOL_SIZE);let freeTop=PART_POOL_SIZE;
for(let i=0;i<PART_POOL_SIZE;i++){partPool[i]={x:0,y:0,vx:0,vy:0,life:0,color:'#fff',size:3,active:false,_i:i};freeList[i]=PART_POOL_SIZE-1-i}
function acquirePart(x,y,vx,vy,color,size){let pt;if(freeTop>0){const idx=freeList[--freeTop];pt=partPool[idx]}else pt=partPool[0];pt.x=x;pt.y=y;pt.vx=vx;pt.vy=vy;pt.life=1;pt.color=color;pt.size=size||3;pt.active=true;return pt}
function releasePart(pt){if(!pt.active)return;pt.active=false;if(freeTop<PART_POOL_SIZE)freeList[freeTop++]=pt._i}
let inv=0,shake=0,spawnT=0,runScore=0,streak=0,shield=0,slowmo=0,wave=0,waveT=0,maxMult=1,cleanFlash=0,hitFlash=0,collectFlash=0,laneFlash=0;
const WAVES=[[0,2],[1],[0,1],[2],[0,2],[1,2],[0],[0,1,2]];
const STAGE_PALETTE=[{body0:'#93c5fd',body1:'#3b82f6',glow:'rgba(147,197,253,0.5)',accent:'#60a5fa'},{body0:'#7dd3fc',body1:'#0ea5e9',glow:'rgba(125,211,252,0.5)',accent:'#38bdf8'},{body0:'#6ee7b7',body1:'#059669',glow:'rgba(110,231,183,0.45)',accent:'#34d399'},{body0:'#c4b5fd',body1:'#7c3aed',glow:'rgba(196,181,253,0.5)',accent:'#a78bfa'},{body0:'#fcd34d',body1:'#f59e0b',glow:'rgba(252,211,77,0.55)',accent:'#fbbf24'}];
canvas.addEventListener('pointerdown',e=>{if(mode!=='running')return;const x=e.clientX-canvas.getBoundingClientRect().left;if(x<W/2){if(targetLane>0){targetLane--;laneFlash=6;beep(320,0.04,'triangle',0.04)}}else{if(targetLane<2){targetLane++;laneFlash=6;beep(380,0.04,'triangle',0.04)}}});
addEventListener('keydown',e=>{if(mode!=='running')return;if(e.key==='ArrowLeft'||e.key==='a'){if(targetLane>0){targetLane--;laneFlash=6}e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'){if(targetLane<2){targetLane++;laneFlash=6}e.preventDefault()}});
function spawnFromWave(){waveT++;let lanes;if(waveT%9===0){const open=Math.floor(Math.random()*3);lanes=[0,1,2].filter(i=>i!==open)}else{lanes=WAVES[wave%WAVES.length].slice();if(lanes.length===3){const open=Math.floor(Math.random()*3);lanes=lanes.filter(i=>i!==open)}}wave++;for(const ln of lanes)posts.push({lane:ln,y:-POST_H-6,w:W*0.25,h:POST_H,hit:false,near:false,type:Math.random()<0.33?0:Math.random()<0.5?1:2});if(Math.random()<0.4){const used=new Set(lanes),free=[0,1,2].filter(i=>!used.has(i));if(free.length)floats.push({lane:free[Math.floor(Math.random()*free.length)],y:-20,r:HEART_R,taken:false,risk:Math.random()<0.45})}if(streak>=6&&Math.random()<0.12)floats.push({lane:Math.floor(Math.random()*3),y:-24,r:13,taken:false,power:true})}
function startRun(){spentThisRun=false;mode='running';targetLane=1;visualLane=1;lives=3;dist=0;hearts=0;mult=1;nearMisses=0;speed=2.7;posts=[];floats=[];pops=[];for(let i=0;i<PART_POOL_SIZE;i++){partPool[i].active=false;freeList[i]=PART_POOL_SIZE-1-i}freeTop=PART_POOL_SIZE;inv=40;shake=0;spawnT=0;runScore=0;streak=0;shield=0;slowmo=0;wave=0;waveT=0;maxMult=1;cleanFlash=0;hitFlash=0;collectFlash=0;laneFlash=0;document.getElementById('menu').classList.add('hidden');document.getElementById('results').classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('hint').style.display='block';beep(520,0.08)}
function endRun(){mode='results';runScore=scoreOf(dist,hearts,Math.max(1,mult),nearMisses);if(runScore>best){best=runScore;save()}document.getElementById('finalScore').textContent=runScore;document.getElementById('finalBest').textContent='Best: '+best;document.getElementById('statsLine').textContent='Hearts '+hearts+' · Near-miss '+nearMisses+' · Max ×'+maxMult.toFixed(1);document.getElementById('results').classList.remove('hidden');document.getElementById('hud').style.display='none';document.getElementById('hint').style.display='none';spentThisRun=false;refreshCareUI({react:'Nix is ready for this score… 💕'});beep(180,0.2,'sawtooth',0.05)}
function stageThreshold(s){return [0,110,200,310,450][s]||9999}
function powerOf(){return care.att+care.ene+care.mood+care.total*0.02}
function spawnCareFloat(txt,color,xOff){
  const panel=document.getElementById('carePanel');
  const el=document.createElement('div');
  el.className='care-float';
  el.textContent=txt;
  el.style.color=color||'#fbbf24';
  el.style.left=(48+(xOff||0))+'%';
  el.style.top='38%';
  panel.appendChild(el);
  setTimeout(()=>el.remove(),950);
}
function spawnCareBurst(){
  const host=document.getElementById('careBurst');
  if(!host)return;
  host.innerHTML='';
  const colors=['#f91880','#1d9bf0','#fbbf24','#34d399','#fb7185','#a78bfa'];
  for(let i=0;i<14;i++){
    const d=document.createElement('i');
    const ang=Math.random()*Math.PI*2;
    const dist=28+Math.random()*50;
    d.style.left='50%';d.style.top='40%';
    d.style.background=colors[i%colors.length];
    d.style.width=(4+Math.random()*5)+'px';
    d.style.height=d.style.width;
    d.style.setProperty('--tx',Math.cos(ang)*dist+'px');
    d.style.setProperty('--ty',Math.sin(ang)*dist+'px');
    d.style.animation='burst .7s ease-out forwards';
    d.style.transform='translate(-50%,-50%)';
    // override keyframes via inline for direction
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(ang)*dist+'px), calc(-50% + '+Math.sin(ang)*dist+'px)) scale(0)',opacity:0}],{duration:700,easing:'ease-out',fill:'forwards'});
    host.appendChild(d);
  }
  setTimeout(()=>{host.innerHTML=''},800);
}
function refreshCareUI(opts){
  opts=opts||{};
  const pet=document.getElementById('carePet');
  const st=Math.min(4,care.stage|0);
  pet.textContent=STAGE_EMOJI[st];
  const pals=['radial-gradient(circle at 30% 30%,#93c5fd,#2563eb)','radial-gradient(circle at 30% 30%,#7dd3fc,#0ea5e9)','radial-gradient(circle at 30% 30%,#6ee7b7,#059669)','radial-gradient(circle at 30% 30%,#c4b5fd,#7c3aed)','radial-gradient(circle at 30% 30%,#fcd34d,#f59e0b)'];
  const glows=['rgba(96,165,250,.5)','rgba(14,165,233,.5)','rgba(5,150,105,.45)','rgba(124,58,237,.5)','rgba(245,158,11,.55)'];
  pet.style.background=pals[st];
  pet.style.boxShadow='0 0 28px '+glows[st]+',inset 0 -6px 12px rgba(0,0,0,.15)';
  document.getElementById('careStage').textContent=STAGES[st]+(st>=4?' ✨':'');
  document.getElementById('careSub').textContent=STAGE_TIP[st];
  // XP / next stage
  const pow=powerOf();
  const nextT=stageThreshold(st+1);
  const prevT=stageThreshold(st);
  const pct=st>=4?100:Math.max(0,Math.min(100,((pow-prevT)/(nextT-prevT))*100));
  const xpFill=document.getElementById('careXpFill');
  const xpLabel=document.getElementById('careXpLabel');
  if(xpFill)xpFill.style.width=pct.toFixed(1)+'%';
  if(xpLabel)xpLabel.textContent=st>=4?'MAX':'Next · '+Math.max(0,Math.ceil(nextT-pow));
  // stage dots
  const dots=document.getElementById('careStages');
  if(dots){
    const kids=dots.children;
    for(let i=0;i<kids.length;i++){
      kids[i].className='care-dot'+(i<=st?' on':'')+(i===st?' cur':'');
    }
  }
  document.getElementById('barAtt').style.width=Math.round(care.att)+'%';
  document.getElementById('barEne').style.width=Math.round(care.ene)+'%';
  document.getElementById('barMood').style.width=Math.round(care.mood)+'%';
  const btn=document.getElementById('careBtn');
  const reactEl=document.getElementById('careReact');
  if(spentThisRun||runScore<=0){
    btn.disabled=true;
    btn.textContent=spentThisRun?'Nix is full & happy 💕':'Score a run first!';
    if(spentThisRun)reactEl.className='care-react full';
  }else{
    btn.disabled=false;

function spendCare(){
  if(spentThisRun||runScore<=0)return;
  const prev=care.stage;
  const p=runScore;
  const dA=Math.max(5,Math.floor(p/24));
  const dE=Math.max(4,Math.floor(p/32));
  const dM=Math.max(5,Math.floor(p/26));
  care.att=Math.min(100,care.att+dA);
  care.ene=Math.min(100,care.ene+dE);
  care.mood=Math.min(100,care.mood+dM);
  care.total+=p;
  const t=powerOf();
  if(care.stage<1&&t>110)care.stage=1;
  if(care.stage<2&&t>200)care.stage=2;
  if(care.stage<3&&t>310)care.stage=3;
  if(care.stage<4&&t>450)care.stage=4;
  save();
  spentThisRun=true;
  const pet=document.getElementById('carePet');
  // floating +stats
  spawnCareFloat('+'+dA+' 👀','#60a5fa',-18);
  setTimeout(()=>spawnCareFloat('+'+dE+' ⚡','#34d399',0),90);
  setTimeout(()=>spawnCareFloat('+'+dM+' 💕','#fb7185',18),180);
  spawnCareBurst();
  if(care.stage>prev){
    pet.classList.remove('bounce','evolve','happy');void pet.offsetWidth;pet.classList.add('evolve');
    refreshCareUI({react:'✨ Evolved into '+STAGES[care.stage]+'! You raised a star!',cls:'evo'});
    beep(880,0.12,'square',0.07);setTimeout(()=>beep(1100,0.15,'sine',0.06),120);setTimeout(()=>beep(1320,0.18,'sine',0.05),260);
  }else{
    pet.classList.remove('bounce','evolve','happy');void pet.offsetWidth;pet.classList.add('happy');
    const lines=[
      'Yum! Nix is glowing ✨',
      'That hit the spot 💕',
      'Nix wiggles with joy!',
      'More timeline power!',
      'Feeling stronger already',
      'Best treat ever!',
      'Nix loves this run 🥰',
      'Feed the legend!',
      'Timeline energy rising'
    ];
    refreshCareUI({react:lines[Math.floor(Math.random()*lines.length)],cls:'good'});
    beep(660,0.08);setTimeout(()=>beep(780,0.07,'sine',0.05),90);setTimeout(()=>beep(920,0.06,'sine',0.04),180);
  }
}

function draw(){const sx=shake>0?(Math.random()-0.5)*shake:0,sy=shake>0?(Math.random()-0.5)*shake:0;if(shake>0)shake*=0.8;ctx.save();if(sx||sy)ctx.translate(sx,sy);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c0c12');bg.addColorStop(0.5,'#12121a');bg.addColorStop(1,'#0a0a10');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.012)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);if(hitFlash>0){ctx.fillStyle='rgba(249,24,128,'+(0.12+hitFlash*0.02).toFixed(3)+')';ctx.fillRect(0,0,W,H)}else if(inv>30){ctx.fillStyle='rgba(249,24,128,0.06)';ctx.fillRect(0,0,W,H)}if(cleanFlash>0){ctx.strokeStyle='rgba(251,191,36,'+(cleanFlash/12*0.7).toFixed(3)+')';ctx.lineWidth=4;ctx.strokeRect(6,6,W-12,H-12)}if(collectFlash>0){ctx.fillStyle='rgba(249,24,128,'+(collectFlash/10*0.08).toFixed(3)+')';ctx.fillRect(0,0,W,H)}ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;for(let i=0;i<3;i++){const x=laneX(i);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}if(mode==='running'){const ax=laneX(visualLane);ctx.fillStyle='rgba(29,155,240,'+(laneFlash>0?0.14:0.05)+')';ctx.fillRect(ax-W*0.11,0,W*0.22,H)}for(const p of posts)drawPost(p);for(const h of floats){if(h.taken)continue;const x=laneX(h.lane),pulse=1+Math.sin(performance.now()/140)*0.14;if(h.power){const rg=ctx.createRadialGradient(x,h.y,2,x,h.y,h.r*pulse+4);rg.addColorStop(0,'rgba(29,155,240,0.9)');rg.addColorStop(1,'rgba(29,155,240,0.1)');ctx.beginPath();ctx.arc(x,h.y,h.r*pulse+4,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();ctx.fillStyle='#1d9bf0';ctx.beginPath();ctx.arc(x,h.y,h.r*pulse,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('✓',x,h.y+4)}else{const col=h.risk?'#fbbf24':'#f91880';const rg=ctx.createRadialGradient(x,h.y,1,x,h.y,h.r*pulse+3);rg.addColorStop(0,col);rg.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(x,h.y,h.r*pulse+3,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();ctx.beginPath();ctx.arc(x,h.y,h.r*0.9*pu
