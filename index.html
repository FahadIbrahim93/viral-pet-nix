<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Nix — Timeline Dodge. Skill-first endless runner. Dodge the feed, near-miss for CLEAN, raise Nix.">
<meta name="theme-color" content="#0b0b12">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>Nix • Timeline Dodge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#07070c;--card:#12121a;--accent:#1d9bf0;--pink:#f91880;--green:#00ba7c;--text:#e7e9ea;--muted:#8b8f98;--gold:#fbbf24;--border:#2a2a36}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation}
.wrap{width:100%;max-width:400px;height:min(92dvh,720px);background:var(--card);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 25px 60px -12px rgba(0,0,0,.7);border:1px solid var(--border)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(7,7,12,.55),rgba(7,7,12,.92));z-index:20;pointer-events:auto}
.overlay.hidden{display:none!important}
.overlay h1{font-size:52px;font-weight:700;letter-spacing:-.03em}
.tag{font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.45;max-width:260px;margin:10px 0 22px}
.btn{background:var(--accent);color:#fff;border:none;padding:14px 28px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;min-height:52px;box-shadow:0 8px 28px rgba(29,155,240,.45);transition:transform .12s;touch-action:manipulation;user-select:none}
.btn:active{transform:scale(.96)}
.btn.secondary{background:rgba(255,255,255,.1);box-shadow:none;font-size:13px;min-height:44px}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score-big{font-size:56px;font-weight:800;color:var(--accent);margin:4px 0}
.muted{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;width:100%;margin-top:8px}
.row .btn{flex:1}
.care{width:100%;max-width:320px;margin:12px 0;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-align:left}
.care-h{display:flex;gap:12px;align-items:center}
.pet-bubble{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 30% 30%,#93c5fd,#2563eb);box-shadow:0 0 22px rgba(96,165,250,.45)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1d9bf0,#60a5fa)}
.hud{position:absolute;top:10px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none;z-index:10;font-weight:600}
.hud .sc{font-size:22px;color:var(--accent)}
.hud .lv{color:var(--pink);font-size:14px}
.hud .mu{color:var(--gold);font-size:12px}
.hud .bi{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);z-index:10;pointer-events:none;display:none}
.mute{position:absolute;bottom:56px;right:12px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(18,18,26,.85);color:var(--text);font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
@keyframes pulse{0%,100%{box-shadow:0 8px 28px rgba(29,155,240,.4)}50%{box-shadow:0 8px 36px rgba(29,155,240,.75)}}
.start-pulse{animation:pulse 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.start-pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="root" role="application" aria-label="Nix Timeline Dodge">
<canvas id="c" width="400" height="720" aria-label="Playfield"></canvas>
<div class="hud" id="hud"><div><div class="lv" id="lives">♥ ♥ ♥</div><div class="mu" id="mult"></div></div><div style="text-align:right"><div class="sc" id="score">0</div><div class="bi" id="biome">Night Feed</div></div></div>
<div class="hint" id="hint">Swipe · A/D · ↑ jump · ↓ slide</div>
<button type="button" class="mute" id="muteBtn" aria-label="Mute">🔊</button>
<div class="overlay" id="menu">
  <div class="tag">Timeline Dodge</div>
  <h1>Nix</h1>
  <p class="sub">Skill-first runner. Near-miss for CLEAN. Jump low posts. Slide under banners. Raise Nix.</p>
  <button type="button" class="btn start-pulse" id="startBtn" data-testid="start-run">Start Run</button>
  <p class="muted" style="margin-top:12px">Best: <span id="bestLabel">0</span></p>
</div>
<div class="overlay hidden" id="results">
  <h1 style="font-size:22px">Run Over</h1>
  <div class="score-big" id="resScore">0</div>
  <p class="muted" id="resStats"></p>
  <div class="care" id="careBox">
    <div class="care-h">
      <div class="pet-bubble" id="careEmoji">🥚</div>
      <div><div style="font-weight:700" id="careStage">Egg</div><div class="muted" id="careTip" style="font-size:11px">Feed Nix with this run</div><div class="bar"><i id="xpFill" style="width:0%"></i></div></div>
    </div>
  </div>
  <button type="button" class="btn" id="careBtn" style="background:linear-gradient(135deg,#f91880,#1d9bf0);width:100%;max-width:320px">Give Nix a treat</button>
  <button type="button" class="btn" id="againBtn" style="width:100%;max-width:320px;margin-top:8px" data-testid="play-again">Play Again</button>
  <div class="row" style="max-width:320px"><button type="button" class="btn secondary" id="shareBtn">Challenge</button><button type="button" class="btn secondary" id="cardBtn">Score Card</button></div>
</div>
</div>
<script>
(function(){
"use strict";
const LANES=3, PLAYER_Y=0.8, POST_H=52, NEAR=38, KEY="nix_dodge_v26", PART_N=96;
const STAGES=["Egg","Hatchling","Timeline Cub","Thread Beast","Viral Legend"];
const EMOJI=["🥚","🐣","🐻","🐉","👑"];
const TIPS=["A warm little egg.","Peeking out!","Learning the lanes.","Rules the feed.","Viral Legend."];
const PAL=[
  {a:"#93c5fd",b:"#3b82f6",g:"rgba(147,197,253,.5)"},
  {a:"#7dd3fc",b:"#0ea5e9",g:"rgba(125,211,252,.5)"},
  {a:"#6ee7b7",b:"#059669",g:"rgba(110,231,183,.45)"},
  {a:"#c4b5fd",b:"#7c3aed",g:"rgba(196,181,253,.5)"},
  {a:"#fcd34d",b:"#f59e0b",g:"rgba(252,211,77,.55)"}
];
const BIOMES=["Night Feed","Viral Storm","Thread City","Legend Hour"];
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const menu=$("menu"),results=$("results"),hud=$("hud"),hint=$("hint");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=400,H=720,dpr=Math.min(devicePixelRatio||1,2);
let phase="menu",targetLane=1,visualLane=1,lives=3,dist=0,hearts=0,coins=0,mult=1,nearMisses=0,speed=2.7;
let posts=[],floats=[],pops=[],best=0,runScore=0,streak=0,shield=0,slowmo=0,magnet=0,maxMult=1,combo=0;
let inv=0,trauma=0,hitstop=0,spawnT=0,air=0,jumpVel=0,slide=0,squash=1,time=0,bgOff=0;
let hitFlash=0,cleanFlash=0,spent=false,react="Ready!",evolved=false,muted=false,queued=0;
let care={att:40,ene:40,mood:40,stage:0,total:0};
let held=new Set(),prevHeld=new Set(),raf=0,last=0,acc=0,starting=false;
const pool=Array.from({length:PART_N},(_,i)=>({x:0,y:0,vx:0,vy:0,life:0,color:"#fff",size:3,active:false,i,glow:false}));
let free=pool.map((_,i)=>i), freeTop=PART_N;
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");if(s.best)best=s.best;if(s.care)Object.assign(care,s.care)}catch(e){}
$("bestLabel").textContent=String(best);

/* Audio */
let actx=null,master=null,musicG=null,sfxG=null,musicT=0,stepN=0,musicOn=false;
function unlockAudio(){
  try{
    if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});master=actx.createGain();musicG=actx.createGain();sfxG=actx.createGain();musicG.gain.value=.2;sfxG.gain.value=.55;master.gain.value=muted?0:.85;musicG.connect(master);sfxG.connect(master);master.connect(actx.destination)}
    if(actx.state==="suspended")actx.resume();
    musicOn=true;
  }catch(e){}
}
function tone(freq,dur,type,vol,bus,slideTo){
  if(!actx||muted||!bus)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),t+dur);
  f.type="lowpass";f.frequency.value=2800;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,hp){
  if(!actx||muted||!sfxG)return;
  const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource();s.buffer=buf;const f=actx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
  const g=actx.createGain(),t=actx.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxG);s.start();
}
const SCALE=[261.63,329.63,392,493.88,523.25,659.25];
function tickMusic(){
  if(!musicOn||!actx||muted||!musicG)return;
  const now=actx.currentTime;if(now<musicT)return;
  const bpm=110+Math.min(1,(speed-2.7)/4)*50,beat=60/bpm;musicT=now+beat*.5;
  const i=stepN++%16,root=SCALE[i%4]*(i%8<4?.5:1);
  tone(root,beat*.4,"triangle",.06+Math.min(1,(speed-2.7)/4)*.04,musicG);
  if(i%4===0)tone(root*.5,beat*.25,"sawtooth",.03,musicG);
}
function sfx(k){
  unlockAudio();if(!sfxG)return;
  const r=1+(Math.random()*.12-.06);
  if(k==="start"){tone(392*r,.12,"triangle",.12,sfxG,784);tone(196,.22,"sine",.08,sfxG)}
  else if(k==="lane")tone(380*r,.045,"triangle",.05,sfxG,510);
  else if(k==="jump"){tone(220*r,.16,"sine",.1,sfxG,660);noise(.08,.04,600)}
  else if(k==="slide")tone(180*r,.12,"sawtooth",.05,sfxG,90);
  else if(k==="clean"){tone(880*r,.14,"sine",.1,sfxG,1320);tone(1320*r,.18,"triangle",.06,sfxG)}
  else if(k==="hit"){noise(.18,.14,180);tone(90*r,.22,"sawtooth",.12,sfxG,40)}
  else if(k==="shield")tone(523*r,.2,"triangle",.1,sfxG,784);
  else if(k==="pickup")tone(660*r,.1,"sine",.09,sfxG,990);
  else if(k==="coin")tone(988*r,.08,"square",.05,sfxG,1480);
  else if(k==="power"){tone(392,.28,"triangle",.1,sfxG,784);tone(196,.4,"sine",.08,sfxG)}
  else if(k==="death"){tone(220,.5,"sawtooth",.12,sfxG,55);noise(.4,.12,120)}
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({best,care}))}catch(e){}}
function scoreOf(){return Math.floor(dist*.16+hearts*28*mult+coins*12+nearMisses*30)}
function biome(){return BIOMES[Math.min(3,(dist/1400)|0)]}
function depthT(y){return Math.max(0,Math.min(1,y/H))}
function spreadAt(y){const t=depthT(y),e=t*t*(3-2*t);return W*(.16+e*.28)}
function laneX(lane,y){return W/2+(lane-1)*spreadAt(y)}
function scaleAt(y){return .28+depthT(y)*.92}
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  W=Math.max(1,r.width);H=Math.max(1,r.height);
  canvas.width=(W*dpr)|0;canvas.height=(H*dpr)|0;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
}
function acquire(x,y,vx,vy,color,size,glow){
  let p;if(freeTop>0)p=pool[free[--freeTop]];else p=pool[0];
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=1;p.color=color;p.size=size;p.active=true;p.glow=!!glow;return p;
}
function release(p){if(!p.active)return;p.active=false;if(freeTop<PART_N)free[freeTop++]=p.i}
function burst(x,y,n,color){if(reduced)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*160;acquire(x,y,Math.cos(a)*s,Math.sin(a)*s-40,color,2+Math.random()*4,true)}}
function addPop(t,x,y,c){pops.push({text:t,x,y,color:c,life:1})}

function nudge(dir){
  if(phase!=="running")return;
  const switching=Math.abs(visualLane-targetLane)>.22;
  if(switching&&Math.sign(targetLane-visualLane)===dir){queued=dir;return}
  const next=targetLane+dir;if(next<0||next>2)return;
  targetLane=next;queued=0;sfx("lane");try{navigator.vibrate?.(8)}catch(e){}
}
function doJump(){if(phase!=="running"||air>0||slide>0)return;air=1;jumpVel=2.4;squash=.72;sfx("jump")}
function doSlide(){if(phase!=="running"||air>0)return;slide=.42;squash=1.25;sfx("slide")}

function spawnWave(){
  const open=(Math.random()*3)|0;
  const kinds=["mid","low","high"];
  for(let ln=0;ln<3;ln++){
    if(ln===open)continue;
    if(dist<1200&&Math.random()<.2)continue;
    posts.push({lane:ln,y:-40,hit:false,near:false,kind:kinds[(Math.random()*3)|0],art:(Math.random()*4)|0,active:true});
  }
  if(Math.random()<.55){
    const types=["heart","coin","coin","coin","check","star"];
    floats.push({lane:open,y:-24,taken:false,type:types[(Math.random()*types.length)|0],active:true});
  }
}

function startRun(){
  if(starting||phase==="running")return;
  starting=true;unlockAudio();sfx("start");
  phase="running";menu.classList.add("hidden");results.classList.add("hidden");
  hud.style.display="flex";hint.style.display="block";
  targetLane=1;visualLane=1;lives=3;dist=0;hearts=0;coins=0;mult=1;nearMisses=0;speed=2.7;
  posts=[];floats=[];pops=[];inv=0;spawnT=.4;runScore=0;streak=0;shield=0;slowmo=0;magnet=0;maxMult=1;combo=0;
  spent=false;air=0;jumpVel=0;slide=0;squash=1;trauma=0;hitstop=0;queued=0;hitFlash=0;cleanFlash=0;
  freeTop=PART_N;pool.forEach((p,i)=>{p.active=false;free[i]=i});
  starting=false;
}

function endRun(){
  if(phase!=="running")return;
  sfx("death");phase="results";runScore=scoreOf();
  if(runScore>best){best=runScore;save()}
  hud.style.display="none";hint.style.display="none";results.classList.remove("hidden");
  $("resScore").textContent=String(runScore);
  $("resStats").textContent=nearMisses+" CLEAN · "+coins+" coins · ×"+maxMult.toFixed(1);
  const st=Math.min(4,care.stage|0);
  $("careEmoji").textContent=EMOJI[st];$("careStage").textContent=STAGES[st];$("careTip").textContent=TIPS[st];
  const pow=care.att+care.ene+care.mood+care.total*.02;
  const thr=[0,110,200,310,450];const next=thr[st+1]||9999,prev=thr[st]||0;
  $("xpFill").style.width=(st>=4?100:Math.max(0,Math.min(100,((pow-prev)/(next-prev))*100)))+"%";
  $("careBtn").disabled=spent||runScore<=0;
}

function spendCare(){
  if(spent||runScore<=0)return;spent=true;
  const feed=Math.min(28,8+runScore/90);
  care.att=Math.min(100,care.att+feed*.45);care.ene=Math.min(100,care.ene+feed*.35);care.mood=Math.min(100,care.mood+feed*.55);
  care.total+=runScore;const pow=care.att+care.ene+care.mood+care.total*.02;
  let st=0;while(st<4&&pow>=[0,110,200,310,450][st+1])st++;
  evolved=st>care.stage;care.stage=st;save();
  $("careBtn").disabled=true;$("careEmoji").textContent=EMOJI[st];$("careStage").textContent=STAGES[st];
  $("careTip").textContent=evolved?STAGES[st]+" evolved!":"Nix loved that run.";
}

function hitPlayer(){
  if(inv>0)return;
  if(shield>0){shield=0;streak=0;inv=.7;trauma=Math.min(1,trauma+.35);sfx("shield");addPop("SHIELD",W/2,H*.5,"#fbbf24");return}
  lives--;mult=1;combo=0;inv=1.05;hitFlash=.28;trauma=Math.min(1,trauma+.7);hitstop=reduced?0:.07;sfx("hit");
  try{navigator.vibrate?.(30)}catch(e){}
  if(lives<=0)endRun();
}

function consumeEdges(){
  const just=c=>held.has(c)&&!prevHeld.has(c);
  if(just("KeyA")||just("ArrowLeft"))nudge(-1);
  if(just("KeyD")||just("ArrowRight"))nudge(1);
  if(just("KeyW")||just("ArrowUp")||just("Space"))doJump();
  if(just("KeyS")||just("ArrowDown"))doSlide();
  prevHeld=new Set(held);
}

function step(dt){
  time+=dt;bgOff+=dt*speed*18;trauma=Math.max(0,trauma-dt*1.8);
  if(hitFlash>0)hitFlash-=dt;if(cleanFlash>0)cleanFlash-=dt;tickMusic();
  if(phase!=="running")return;
  const ts=slowmo>0?.42:1;if(slowmo>0)slowmo-=dt;if(magnet>0)magnet-=dt;if(inv>0)inv-=dt;
  const t=dt*ts;speed=Math.min(7.1,2.7+dist*.00055);dist+=speed*90*t;
  visualLane+=(targetLane-visualLane)*(1-Math.exp(-18*t));
  if(Math.abs(visualLane-targetLane)<.04&&queued){const d=queued;queued=0;nudge(d)}
  if(air>0){jumpVel-=7.2*t;air+=jumpVel*t;if(air<=0){air=0;jumpVel=0;squash=1.22;burst(laneX(visualLane,H*PLAYER_Y),H*PLAYER_Y+16,8,"#93c5fd")}}
  if(slide>0)slide-=t;squash+=(1-squash)*(1-Math.exp(-10*t));
  spawnT-=t;if(spawnT<=0){spawnWave();spawnT=Math.max(.48,1.05-dist*.00018)}
  const py=H*PLAYER_Y-air*52,px=laneX(visualLane,py),scroll=speed*210*t;
  for(const p of posts){
    if(!p.active)continue;p.y+=scroll;if(p.y>H+80){p.active=false;continue}
    const sc=scaleAt(p.y),ox=laneX(p.lane,p.y),dy=p.y-py,dx=Math.abs(ox-px);
    const laneClose=Math.abs(p.lane-visualLane)<.45&&dx<36*sc+10,inZ=dy>-18&&dy<POST_H*sc+8;
    if(!p.hit&&laneClose&&inZ){
      if((air>.18&&p.kind==="low")||(slide>0&&p.kind==="high"))p.near=true;
      else{p.hit=true;burst(ox,p.y,18,"#f91880");hitPlayer()}
    }else if(!p.near&&!p.hit&&Math.abs(p.lane-visualLane)>.55&&dy>-8&&dy<POST_H){
      const ndx=Math.abs(ox-px);if(ndx>28&&ndx<NEAR+34){
        p.near=true;nearMisses++;combo++;streak++;mult=Math.min(8,mult+.35);maxMult=Math.max(maxMult,mult);cleanFlash=.24;
        if(streak>=8&&shield<=0){shield=1;sfx("shield");addPop("SHIELD ×8",ox,p.y,"#fbbf24")}
        sfx("clean");burst(ox,p.y+10,12,"#00ba7c");addPop("CLEAN",ox,p.y,"#00ba7c");
      }
    }
  }
  posts=posts.filter(p=>p.active);
  for(const f of floats){
    if(!f.active)continue;f.y+=scroll*.96;if(magnet>0)f.lane+=(visualLane-f.lane)*.08;
    if(f.y>H+40){f.active=false;continue}
    const ox=laneX(f.lane,f.y);if(!f.taken&&Math.abs(ox-px)<32&&Math.abs(f.y-py)<34){
      f.taken=true;f.active=false;
      if(f.type==="heart"){hearts++;if(hearts%4===0)lives=Math.min(3,lives+1);sfx("pickup");addPop("+HEART",ox,f.y,"#f91880");burst(ox,f.y,10,"#f91880")}
      else if(f.type==="coin"){coins++;sfx("coin");addPop("+COIN",ox,f.y,"#fbbf24");burst(ox,f.y,8,"#fbbf24")}
      else if(f.type==="check"){slowmo=1.8;sfx("power");addPop("SLOW-MO",ox,f.y,"#1d9bf0");burst(ox,f.y,16,"#1d9bf0")}
      else{magnet=4.5;mult=Math.min(8,mult+.8);maxMult=Math.max(maxMult,mult);sfx("power");addPop("STAR",ox,f.y,"#fbbf24");burst(ox,f.y,16,"#fcd34d")}
    }
  }
  floats=floats.filter(f=>f.active);
  for(const p of pool){if(!p.active)continue;p.life-=t*1.6;if(p.life<=0){release(p);continue}p.x+=p.vx*t;p.y+=p.vy*t;p.vy+=220*t}
  for(let i=pops.length-1;i>=0;i--){pops[i].life-=t*1.3;pops[i].y-=40*t;if(pops[i].life<=0)pops.splice(i,1)}
  $("score").textContent=String(scoreOf());$("lives").textContent="♥ ".repeat(Math.max(0,lives)).trim()||"—";
  $("mult").textContent=mult>1?"×"+mult.toFixed(1)+(streak>=3?" · "+streak:"")+(shield?" SHIELD":""):"";
  $("biome").textContent=biome();
}

function drawPet(x,y,running){
  const pal=PAL[Math.min(4,care.stage|0)],bounce=running&&air<=0?Math.abs(Math.sin(time*14))*4:0,swing=running&&air<=0?Math.sin(time*14)*9:air>0?6:0;
  ctx.save();ctx.translate(x,y-bounce);ctx.scale(1/squash,squash);if(slide>0)ctx.scale(1.25,.72);
  ctx.shadowColor=pal.g;ctx.shadowBlur=18;
  const grd=ctx.createRadialGradient(-6,-10,4,0,0,26);grd.addColorStop(0,pal.a);grd.addColorStop(1,pal.b);
  ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(0,0,22,24,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=pal.b;ctx.beginPath();ctx.ellipse(-14,-16,7,9,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(14,-16,7,9,.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=pal.a;ctx.beginPath();ctx.ellipse(-14,-16,4,5,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(14,-16,4,5,.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#0f0f13";ctx.beginPath();ctx.ellipse(-7,-4,4.2,4.8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(7,-4,4.2,4.8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-5.6,-5.4,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8.4,-5.4,1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(249,24,128,.45)";ctx.beginPath();ctx.arc(-13,4,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(13,4,5,0,Math.PI*2);ctx.fill();
  if(running||air>0){ctx.strokeStyle=pal.b;ctx.lineWidth=6;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-11,16);ctx.quadraticCurveTo(-16,24+swing,-12,32+swing);ctx.moveTo(11,16);ctx.quadraticCurveTo(16,24-swing,12,32-swing);ctx.stroke();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,2);ctx.lineTo(-22,10-swing*.4);ctx.moveTo(16,2);ctx.lineTo(22,10+swing*.4);ctx.stroke()}
  if(shield>0){ctx.strokeStyle="rgba(251,191,36,.75)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,32+Math.sin(time*6)*2,0,Math.PI*2);ctx.stroke()}
  ctx.restore();
}

function draw(){
  const shake=reduced?0:trauma*trauma,ox=shake?(Math.random()*2-1)*14*shake:0,oy=shake?(Math.random()*2-1)*10*shake:0;
  ctx.setTransform(dpr,0,0,dpr,ox*dpr,oy*dpr);
  ctx.fillStyle="#07070c";ctx.fillRect(-20,-20,W+40,H+40);
  const horizon=H*.18;
  const bi=Math.min(3,(dist/1400)|0);
  const sky=ctx.createLinearGradient(0,0,0,H);
  if(bi===0){sky.addColorStop(0,"#0a1020");sky.addColorStop(1,"#07070c")}
  else if(bi===1){sky.addColorStop(0,"#1a0814");sky.addColorStop(1,"#0c070a")}
  else if(bi===2){sky.addColorStop(0,"#0c0830");sky.addColorStop(1,"#07070c")}
  else{sky.addColorStop(0,"#1a1408");sky.addColorStop(1,"#0c0a06")}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle="rgba(255,255,255,.35)";
  for(let i=0;i<28;i++){const sx=((i*97+bgOff*.2)%W),sy=((i*53)%(horizon+20));ctx.fillRect(sx,sy,1.5,1.5)}
  // road
  ctx.beginPath();ctx.moveTo(W/2-W*.12,horizon);ctx.lineTo(W/2+W*.12,horizon);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();
  const rg=ctx.createLinearGradient(0,horizon,0,H);rg.addColorStop(0,"rgba(29,155,240,.06)");rg.addColorStop(1,"rgba(15,15,22,.75)");ctx.fillStyle=rg;ctx.fill();
  ctx.strokeStyle="rgba(29,155,240,.3)";ctx.lineWidth=2;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(laneX(i,horizon+4),horizon+4);ctx.lineTo(laneX(i,H),H);ctx.stroke()}
  // entities
  const ents=[...posts.filter(p=>p.active),...floats.filter(f=>f.active)].sort((a,b)=>a.y-b.y);
  for(const e of ents){
    const sc=scaleAt(e.y),x=laneX(e.lane,e.y);
    if("kind" in e){
      const h=(e.kind==="high"?88:e.kind==="low"?42:64)*sc,w=70*sc;
      ctx.globalAlpha=e.hit?.35:1;
      const g=ctx.createLinearGradient(x-w/2,e.y,x+w/2,e.y+h);
      g.addColorStop(0,e.kind==="high"?"#3b1a4a":e.kind==="low"?"#1a2a4a":"#2a2a36");
      g.addColorStop(1,"#15151c");
      ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,e.y,w,h,10*sc);ctx.fill();
      ctx.strokeStyle="rgba(29,155,240,.35)";ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle="#71767b";ctx.fillRect(x-w*.3,e.y+h*.25,w*.6,3*sc);ctx.fillRect(x-w*.3,e.y+h*.45,w*.4,3*sc);
      if(e.kind==="high"){ctx.fillStyle="#1d9bf0";ctx.font=(12*sc)+"px system-ui";ctx.textAlign="center";ctx.fillText("☰",x,e.y+h*.75)}
      if(e.kind==="low"){ctx.fillStyle="#f91880";ctx.font=(11*sc)+"px system-ui";ctx.fillText("♥",x,e.y+h*.7)}
      ctx.globalAlpha=1;
    }else{
      const s=40*sc;ctx.beginPath();ctx.arc(x,e.y,s/2,0,Math.PI*2);
      ctx.fillStyle=e.type==="heart"?"#f91880":e.type==="coin"?"#fbbf24":e.type==="check"?"#1d9bf0":"#fcd34d";
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle="#fff";ctx.font=(14*sc)+"px system-ui";ctx.textAlign="center";
      ctx.fillText(e.type==="heart"?"♥":e.type==="coin"?"●":e.type==="check"?"✓":"★",x,e.y+5*sc);
    }
  }
  const py=H*PLAYER_Y-air*52,px=laneX(visualLane,py);
  if(inv>0&&Math.sin(time*40)<0)ctx.globalAlpha=.45;
  drawPet(px,py,phase==="running"||phase==="menu");
  ctx.globalAlpha=1;
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(const p of pool){if(!p.active)continue;ctx.globalAlpha=Math.max(0,p.life)*(p.glow?.9:.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.glow?1.4:1),0,Math.PI*2);ctx.fill()}
  ctx.restore();ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.font="700 14px Space Grotesk,system-ui";
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y)}
  ctx.globalAlpha=1;
  if(cleanFlash>0){ctx.fillStyle=`rgba(0,186,124,${.12*(cleanFlash/.24)})`;ctx.fillRect(0,0,W,H)}
  if(hitFlash>0){ctx.fillStyle=`rgba(249,24,128,${.16*(hitFlash/.28)})`;ctx.fillRect(0,0,W,H)}
}

function loop(ts){
  if(!last)last=ts;let raw=Math.min(.05,(ts-last)/1000);last=ts;
  if(hitstop>0){hitstop-=raw;draw();raf=requestAnimationFrame(loop);return}
  acc+=raw;const stepDt=1/60;let n=0;
  while(acc>=stepDt&&n<5){consumeEdges();step(stepDt);acc-=stepDt;n++}
  draw();raf=requestAnimationFrame(loop);
}

function bindStart(btn,fn){let lock=false;const go=e=>{if(lock)return;lock=true;if(e){e.preventDefault();e.stopPropagation()}fn();setTimeout(()=>lock=false,400)};btn.addEventListener("pointerup",go,{passive:false});btn.addEventListener("click",go)}
bindStart($("startBtn"),startRun);bindStart($("againBtn"),startRun);
$("careBtn").onclick=spendCare;
$("shareBtn").onclick=()=>{const t=`I scored ${runScore} on Nix Timeline Dodge\n${nearMisses} CLEANs · ×${maxMult.toFixed(1)}\nBeat me! #ViralPet #Nix`;if(navigator.share)navigator.share({title:"Nix",text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$("shareBtn").textContent="Copied!";setTimeout(()=>$("shareBtn").textContent="Challenge",1400)})};
$("cardBtn").onclick=()=>{const c=document.createElement("canvas");c.width=420;c.height=520;const g=c.getContext("2d");g.fillStyle="#0b0b12";g.fillRect(0,0,420,520);g.strokeStyle="#1d9bf0";g.lineWidth=3;g.strokeRect(16,16,388,488);g.fillStyle="#e7e9ea";g.font="700 28px system-ui";g.textAlign="center";g.fillText("NIX",210,70);g.fillStyle="#1d9bf0";g.font="800 72px system-ui";g.fillText(String(runScore),210,170);g.fillStyle="#8b8f98";g.font="16px system-ui";g.fillText(nearMisses+" CLEAN · ×"+maxMult.toFixed(1),210,220);g.fillStyle="#f91880";g.font="700 20px system-ui";g.fillText("Nix is "+STAGES[Math.min(4,care.stage)],210,280);g.fillStyle="#71767b";g.font="14px system-ui";g.fillText("Beat me on Timeline Dodge",210,360);c.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="nix-score.png";a.click();setTimeout(()=>URL.revokeObjectURL(u),2e3)})};
$("muteBtn").onclick=()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";if(master&&actx)master.gain.setTargetAtTime(muted?0:.85,actx.currentTime,.03)};
window.addEventListener("keydown",e=>{if(e.repeat)return;held.add(e.code);if((e.code==="Enter"||e.code==="Space")&&phase!=="running"){e.preventDefault();startRun()}});
window.addEventListener("keyup",e=>held.delete(e.code));
window.addEventListener("blur",()=>held.clear());
window.addEventListener("resize",resize);
// touch play surface
canvas.style.pointerEvents="none";
const surface=document.createElement("div");surface.style.cssText="position:absolute;inset:0;z-index:15;touch-action:none";surface.id="playSurface";
$("root").appendChild(surface);
let gx=0,gy=0,gt=0,fired=false,gid=-1,lastX=0;
surface.addEventListener("pointerdown",e=>{if(phase!=="running"||!e.isPrimary)return;e.preventDefault();try{surface.setPointerCapture(e.pointerId)}catch(err){}const r=surface.getBoundingClientRect();gx=e.clientX-r.left;gy=e.clientY-r.top;gt=performance.now();fired=false;gid=e.pointerId;lastX=gx});
surface.addEventListener("pointermove",e=>{if(phase!=="running"||e.pointerId!==gid)return;const r=surface.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top,dx=x-gx,dy=y-gy;
  if(!fired&&Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx)){if(dy<0)doJump();else doSlide();fired=true;return}
  if(!fired&&Math.abs(dx)>=28){nudge(dx>0?1:-1);fired=true;lastX=x}else if(fired&&Math.abs(x-lastX)>=42){nudge(x>lastX?1:-1);lastX=x}});
surface.addEventListener("pointerup",e=>{if(e.pointerId!==gid)return;if(!fired&&performance.now()-gt<320&&Math.abs(e.clientX-surface.getBoundingClientRect().left-gx)<22)nudge(gx<surface.getBoundingClientRect().width/2?-1:1);gid=-1});
window.__nixStart=startRun;
window.__controlsTest={getYaw:()=>-targetLane,getSpeed:()=>phase==="running"?speed:0,setKeys:c=>{held=new Set(c)}};
resize();last=performance.now();raf=requestAnimationFrame(loop);
console.info("[Nix] Timeline Dodge AAA ready");
})();
</script>
