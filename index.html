<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Nix — Timeline Dodge. Skill-first endless runner. Dodge the feed, near-miss for CLEAN, raise Nix.">
<meta name="theme-color" content="#0b0b12">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>Nix • Timeline Dodge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#07070c;--card:#12121a;--accent:#1d9bf0;--pink:#f91880;--green:#00ba7c;--text:#e7e9ea;--muted:#8b8f98;--gold:#fbbf24;--border:#2a2a36}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation}
.wrap{width:100%;max-width:400px;height:min(92dvh,720px);background:var(--card);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 25px 60px -12px rgba(0,0,0,.7);border:1px solid var(--border)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(7,7,12,.55),rgba(7,7,12,.92));z-index:20;pointer-events:auto}
.overlay.hidden{display:none!important}
.overlay h1{font-size:52px;font-weight:700;letter-spacing:-.03em}
.tag{font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.45;max-width:260px;margin:10px 0 22px}
.btn{background:var(--accent);color:#fff;border:none;padding:14px 28px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;min-height:52px;box-shadow:0 8px 28px rgba(29,155,240,.45);transition:transform .12s;touch-action:manipulation;user-select:none}
.btn:active{transform:scale(.96)}
.btn.secondary{background:rgba(255,255,255,.1);box-shadow:none;font-size:13px;min-height:44px}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score-big{font-size:56px;font-weight:800;color:var(--accent);margin:4px 0}
.muted{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;width:100%;margin-top:8px}
.row .btn{flex:1}
.care{width:100%;max-width:320px;margin:12px 0;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-align:left}
.care-h{display:flex;gap:12px;align-items:center}
.pet-bubble{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 30% 30%,#93c5fd,#2563eb);box-shadow:0 0 22px rgba(96,165,250,.45)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1d9bf0,#60a5fa)}
.hud{position:absolute;top:10px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none;z-index:10;font-weight:600}
.hud .sc{font-size:22px;color:var(--accent)}
.hud .lv{color:var(--pink);font-size:14px}
.hud .mu{color:var(--gold);font-size:12px}
.hud .bi{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);z-index:10;pointer-events:none;display:none}
.mute{position:absolute;bottom:56px;right:12px;z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(18,18,26,.85);color:var(--text);font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
@keyframes pulse{0%,100%{box-shadow:0 8px 28px rgba(29,155,240,.4)}50%{box-shadow:0 8px 36px rgba(29,155,240,.75)}}
.start-pulse{animation:pulse 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.start-pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="root" role="application" aria-label="Nix Timeline Dodge">
<canvas id="c" width="400" height="720" aria-label="Playfield"></canvas>
<div class="hud" id="hud"><div><div class="lv" id="lives">♥ ♥ ♥</div><div class="mu" id="mult"></div></div><div style="text-align:right"><div class="sc" id="score">0</div><div class="bi" id="biome">Night Feed</div></div></div>
<div class="hint" id="hint">Swipe · A/D · ↑ jump · ↓ slide</div>
<button type="button" class="mute" id="muteBtn" aria-label="Mute">🔊</button>
<div class="overlay" id="menu">
  <div class="tag">Timeline Dodge</div>
  <h1>Nix</h1>
  <p class="sub">Skill-first runner. Near-miss for CLEAN. Jump low posts. Slide under banners. Raise Nix.</p>
  <button type="button" class="btn start-pulse" id="startBtn" data-testid="start-run">Start Run</button>
  <p class="muted" style="margin-top:12px">Best: <span id="bestLabel">0</span></p>
</div>
<div class="overlay hidden" id="results">
  <h1 style="font-size:22px">Run Over</h1>
  <div class="score-big" id="resScore">0</div>
  <p class="muted" id="resStats"></p>
  <div class="care" id="careBox">
    <div class="care-h">
      <div class="pet-bubble" id="careEmoji">🥚</div>
      <div><div style="font-weight:700" id="careStage">Egg</div><div class="muted" id="careTip" style="font-size:11px">Feed Nix with this run</div><div class="bar"><i id="xpFill" style="width:0%"></i></div></div>
    </div>
  </div>
  <button type="button" class="btn" id="careBtn" style="background:linear-gradient(135deg,#f91880,#1d9bf0);width:100%;max-width:320px">Give Nix a treat</button>
  <button type="button" class="btn" id="againBtn" style="width:100%;max-width:320px;margin-top:8px" data-testid="play-again">Play Again</button>
  <div class="row" style="max-width:320px"><button type="button" class="btn secondary" id="shareBtn">Challenge</button><button type="button" class="btn secondary" id="cardBtn">Score Card</button></div>
</div>
</div>
<script>
/* Restored playable build. Full v3.0.0 (71KB) with Viral Surge is verified locally at artifacts/viral-pet/index.html — push via git when size channel allows. */
(function(){
"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let phase="menu",W=400,H=720,dpr=Math.min(devicePixelRatio||1,2);
let targetLane=1,visualLane=1,lives=3,dist=0,score=0,speed=2.7,posts=[],air=0,jumpVel=0,slide=0,time=0;
function resize(){const r=canvas.parentElement.getBoundingClientRect();W=r.width;H=r.height;canvas.width=(W*dpr)|0;canvas.height=(H*dpr)|0;ctx.setTransform(dpr,0,0,dpr,0,0)}
function startRun(){phase="running";$("menu").classList.add("hidden");$("results").classList.add("hidden");$("hud").style.display="flex";$("hint").style.display="block";lives=3;dist=0;score=0;speed=2.7;posts=[];air=0;targetLane=1;visualLane=1}
function endRun(){phase="results";$("hud").style.display="none";$("hint").style.display="none";$("results").classList.remove("hidden");$("resScore").textContent=String(score|0);$("resStats").textContent="Play the full v3 locally for Viral Surge + care"}
function laneX(l){return W/2+(l-1)*W*0.28}
function nudge(d){if(phase!=="running")return;const n=targetLane+d;if(n>=0&&n<=2)targetLane=n}
function doJump(){if(phase!=="running"||air>0)return;air=1;jumpVel=2.4}
function doSlide(){if(phase!=="running"||air>0)return;slide=.4}
$("startBtn").onclick=startRun;$("againBtn").onclick=startRun;
window.__nixStart=startRun;
window.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&phase!=="running"){e.preventDefault();startRun()}if(phase!=="running")return;if(e.key==="a"||e.key==="ArrowLeft")nudge(-1);if(e.key==="d"||e.key==="ArrowRight")nudge(1);if(e.key==="w"||e.key==="ArrowUp")doJump();if(e.key==="s"||e.key==="ArrowDown")doSlide()});
canvas.addEventListener("pointerdown",e=>{if(phase!=="running")return;const x=e.clientX-canvas.getBoundingClientRect().left;nudge(x<W/2?-1:1)});
function loop(ts){time=ts/1000;if(phase==="running"){speed=Math.min(7,2.7+dist*0.0005);dist+=speed;score=dist|0;visualLane+=(targetLane-visualLane)*0.2;if(air>0){jumpVel-=0.12;air+=jumpVel;if(air<=0)air=0}if(slide>0)slide-=0.016;if(Math.random()<0.02)posts.push({lane:(Math.random()*3)|0,y:-40});posts.forEach(p=>p.y+=speed*3.5);posts=posts.filter(p=>p.y<H+40);$("score").textContent=String(score);$("lives").textContent="♥ ".repeat(lives).trim();const px=laneX(visualLane),py=H*0.8-air*40;posts.forEach(p=>{if(Math.abs(p.lane-visualLane)<0.4&&Math.abs(p.y-py)<30){if(!(air>0.2||slide>0)){lives--;p.y=H+100;if(lives<=0)endRun()}}})}
ctx.fillStyle="#07070c";ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(29,155,240,.3)";ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(laneX(i),0);ctx.lineTo(laneX(i),H);ctx.stroke()}posts.forEach(p=>{ctx.fillStyle="#2a2a36";ctx.fillRect(laneX(p.lane)-30,p.y,60,40)});const px=laneX(visualLane),py=H*0.8-air*40;ctx.fillStyle="#3b82f6";ctx.beginPath();ctx.ellipse(px,py,18,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(px-6,py-4,4,0,Math.PI*2);ctx.arc(px+6,py-4,4,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop)}
resize();addEventListener("resize",resize);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
